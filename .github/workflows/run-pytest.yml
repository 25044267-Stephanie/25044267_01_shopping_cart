
name: Shopping Cart Pytest

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'

  workflow_dispatch:

concurrency:
  group: shopping-cart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run pytest
        run: python -m pytest -v